<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Paint a luxury first frame before the application bundle arrives. */
      html,body{margin:0;min-height:100%;background:#f2d8b6}
      .opening-loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px 24px;box-sizing:border-box;text-align:center;background:radial-gradient(ellipse at 50% 35%,#fff7ea 0%,#f6e2c6 52%,#e8c496 100%);color:#80511d;opacity:1;transition:opacity .65s cubic-bezier(.22,.85,.35,1),visibility .65s ease}
      .opening-loader--hidden{opacity:0;visibility:hidden;pointer-events:none}
      .opening-loader__eyebrow{margin:0;font:600 10px/1.4 Georgia,serif;letter-spacing:.26em;text-transform:uppercase;color:#9a6530}
      .opening-loader__crest{font:400 clamp(52px,14vw,76px)/1.05 'Great Vibes',cursive;color:#9b611e;text-shadow:0 2px 16px rgba(255,240,200,.9)}
      .opening-loader__status{margin:4px 0 0;font:500 10px/1.4 Georgia,serif;letter-spacing:.18em;text-transform:uppercase;color:#9a6b32;opacity:.8}
      .opening-loader__bar{width:clamp(120px,42vw,200px);height:2px;border-radius:2px;background:rgba(180,130,60,.2);overflow:hidden}
      .opening-loader__bar span{display:block;width:45%;height:100%;background:linear-gradient(90deg,transparent,#c8903a,#f0d080,#c8903a,transparent);animation:loader-sweep 1.5s ease-in-out infinite}
      .opening-loader .opening-loader__action{min-height:44px;margin-top:12px;padding:10px 14px 8px;border:0;border-bottom:1px solid rgba(126,82,38,.55);border-radius:0;background:transparent;color:#684219;box-shadow:none;font:600 11px/1.3 Georgia,serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .3s ease,border-color .3s ease}
      .opening-loader__action span{margin-left:8px;font-size:14px;color:inherit}
      .opening-loader__action:disabled{opacity:.65;cursor:default}
      @keyframes loader-sweep{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
      @media(prefers-reduced-motion:reduce){.opening-loader{transition:none}.opening-loader__bar span{animation:none;width:100%}}
    </style>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%assets/fonts/GreatVibes-fd86ce7ba460.woff2" />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/cinematic/ambient/closed-fixed-optimized.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/cinematic/journey/beach-plate.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/cinematic/main-background.webp" />
    <title>Himeshi &amp; Madhawa | Wedding Invitation</title>
  </head>
  <body>
    <div id="root"><div class="opening-loader" role="status" aria-live="polite"><p class="opening-loader__eyebrow">A celebration of love</p><div class="opening-loader__crest">H&amp;M</div><p class="opening-loader__status">Preparing your invitation</p><div class="opening-loader__bar" aria-hidden="true"><span></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

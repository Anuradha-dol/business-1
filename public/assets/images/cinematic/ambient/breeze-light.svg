<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1648 928" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#fff4ca" stop-opacity="0"/><stop offset=".45" stop-color="#fff4ca" stop-opacity=".42"/><stop offset="1" stop-color="#fff4ca" stop-opacity="0"/></linearGradient>
    <linearGradient id="silk" x1="0" x2="1" y1="0" y2=".2"><stop stop-color="#fffaf1" stop-opacity="0"/><stop offset=".5" stop-color="#fffaf1" stop-opacity=".18"/><stop offset="1" stop-color="#fffaf1" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="silk-soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <style>
    .sparkle {animation: shimmer 5.6s ease-in-out infinite alternate; transform-origin: 220px 570px}
    .sparkle.second {animation-delay:-3.1s;animation-duration:7s}
    .fold {animation: breathe 9s ease-in-out infinite alternate; transform-origin: 170px 760px}
    .fold.right {animation-delay:-4s;animation-duration:11s;transform-origin:1460px 790px}
    @keyframes shimmer {from {opacity:.22;transform:translateX(-7px)} to {opacity:.85;transform:translateX(7px)}}
    @keyframes breathe {from {opacity:.2;transform:translateY(-3px)} to {opacity:.72;transform:translateY(4px)}}
    @media (prefers-reduced-motion:reduce) {.sparkle,.fold {animation:none;opacity:.25}}
  </style>
  <g fill="none" stroke="url(#water)" stroke-linecap="round" filter="url(#soft)">
    <g class="sparkle" stroke-width="3"><path d="M27 543q71 4 146 0"/><path d="M101 565q43 3 98 0"/><path d="M24 600q83 5 164 0"/><path d="M152 623q58 2 112 -2"/></g>
    <g class="sparkle second" stroke-width="2"><path d="M147 531q42 2 82 0"/><path d="M0 581q54 3 106 0"/><path d="M43 623q43 3 91 0"/><path d="M191 594q37 1 70 -1"/></g>
  </g>
  <g fill="none" stroke="url(#silk)" stroke-linecap="round" filter="url(#silk-soft)">
    <path class="fold" stroke-width="17" d="M-35 840 C83 786 160 724 267 717 C319 713 356 735 401 741"/>
    <path class="fold right" stroke-width="15" d="M1210 709 C1323 719 1421 713 1524 673 C1580 650 1614 638 1682 643"/>
  </g>
</svg>
